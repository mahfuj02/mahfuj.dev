name: Add Project

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: "GitHub repo URL, e.g. https://github.com/mahfuj02/some-project"
        required: true
      position:
        description: "Where it goes in the project list (1 = top / featured card). Too large = end of list."
        required: false
        default: "1"
      live_url:
        description: "Optional: live site URL. Used for the banner screenshot and the Live site link."
        required: false
      image_url:
        description: "Optional: link to a banner image (wins over live_url). Tip: drag an image into any GitHub issue comment to get a link."
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  add:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for screenshots
        run: npx playwright install --with-deps chromium

      - name: Generate project entry
        id: add
        env:
          REPO_URL: ${{ inputs.repo_url }}
          POSITION: ${{ inputs.position }}
          LIVE_URL: ${{ inputs.live_url }}
          IMAGE_URL: ${{ inputs.image_url }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BODY_FILE: ${{ runner.temp }}/pr-body.md
        run: node scripts/projects/add-project.mjs

      - name: Build site
        run: npm run build

      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: ${{ steps.add.outputs.branch }}
          add-paths: |
            data/projects.json
            public/projects/${{ steps.add.outputs.slug }}.jpg
          commit-message: "feat(projects): add ${{ steps.add.outputs.title }} at position ${{ steps.add.outputs.position }}"
          title: "Add project: ${{ steps.add.outputs.title }} (position ${{ steps.add.outputs.position }})"
          body-path: ${{ steps.add.outputs.pr_body_file }}
          delete-branch: true
